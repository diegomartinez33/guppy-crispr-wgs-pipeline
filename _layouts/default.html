<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>
  // Apply saved theme preference before paint (avoids a flash of the wrong theme).
  (function () {
    try {
      var saved = localStorage.getItem('guppy-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="top">
  <div class="topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}">🐟 Guppy CRISPR WGS Pipeline</a>
    <nav class="jump">
      <a href="{{ '/' | relative_url }}">Inicio</a>
      <a href="{{ '/docs/PIPELINE.html' | relative_url }}">Pipeline</a>
      <a href="{{ '/docs/TUTORIAL.html' | relative_url }}">Tutorial</a>
      <a href="{{ '/docs/RESULTS.html' | relative_url }}">Resultados</a>
      <a href="{{ '/docs/CLUSTER_ACCESS.html' | relative_url }}">Clúster</a>
      <button id="theme-toggle" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro/oscuro">◐</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <article class="markdown-content">
    {{ content }}
  </article>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>{{ site.title }} · <a href="https://github.com/diegomartinez33/guppy-crispr-wgs-pipeline">repositorio en GitHub</a> · Universidad de los Andes, Colombia.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  // Wrap tables for horizontal scroll on narrow screens.
  document.querySelectorAll('.markdown-content table').forEach(function (t) {
    if (t.parentElement.classList.contains('table-wrap')) return;
    var wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  // Render ```mermaid fenced blocks client-side (kramdown/rouge only
  // syntax-highlights them as plain code, it doesn't draw the diagram).
  (function () {
    var blocks = document.querySelectorAll('code.language-mermaid, code[class*="language-mermaid"]');
    if (!blocks.length) return;
    blocks.forEach(function (code, i) {
      var container = code.closest('.highlighter-rouge') || code.closest('pre') || code.parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mermaid-diagram-' + i;
      div.textContent = code.textContent;
      container.parentNode.insertBefore(div, container);
      container.style.display = 'none';
    });
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (document.documentElement.getAttribute('data-theme') !== 'light' &&
       window.matchMedia('(prefers-color-scheme: dark)').matches);
    mermaid.initialize({ startOnLoad: true, theme: isDark ? 'dark' : 'default', securityLevel: 'loose' });
  })();

  // Light/dark theme toggle.
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme');
      var isDarkNow = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next = isDarkNow ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('guppy-theme', next); } catch (e) {}
    });
  })();
</script>

</body>
</html>
