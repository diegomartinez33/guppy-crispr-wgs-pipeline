title: Guppy CRISPR-Cas9 WGS Analysis Pipeline
description: >-
  Bioinformatics pipeline for WGS analysis of CRISPR-Cas9 editing efficiency
  and off-target effects in a Colombian population of Poecilia reticulata,
  with proprietary population genomic resources and reusable tools for
  CRISPR guide and PCR primer design.
lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-relative-links

# Applies the custom layout to every .md page without needing per-file
# front matter; also assigns a distinct tab title per page (without
# touching the markdown source).
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "README.md"
    values:
      title: "Home"
  - scope:
      path: "docs/PIPELINE.md"
    values:
      title: "Pipeline"
  - scope:
      path: "docs/TUTORIAL.md"
    values:
      title: "Tutorial"
  - scope:
      path: "docs/RESULTS.md"
    values:
      title: "Results"
  - scope:
      path: "docs/CLUSTER_ACCESS.md"
    values:
      title: "Cluster Access"

# CLAUDE.md is an internal working log (verbose, not formatted for public
# reading) - kept in the repo but not published as a site page.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
